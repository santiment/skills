# go-task task runner for the san-skills monorepo.
# https://taskfile.dev
version: "3"

vars:
  # Space-separated list of CLI binaries in the family. Add new tools here.
  TOOLS: score
  BIN_DIR: "{{.ROOT_DIR}}/bin"
  # Platforms to bundle the `score` binary for inside the score skill.
  # Space-separated GOOS/GOARCH pairs. Extend with linux/arm64 darwin/amd64
  # windows/amd64 if those targets are needed (Windows also needs a .ps1 wrapper).
  SKILL_PLATFORMS: linux/amd64 darwin/arm64
  SCORE_SKILL_DIR: "{{.ROOT_DIR}}/skills/score/scripts"

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  gen:
    desc: Normalize OpenAPI specs (3.1->3.0 + operationId) and regenerate API clients
    cmds:
      - go run ./tools/specnorm api/specs/sanr.json      api/specs/sanr.normalized.json
      - go run ./tools/specnorm api/specs/arena.json     api/specs/arena.normalized.json
      - go tool oapi-codegen -config api/oapi-sanr.yaml  api/specs/sanr.normalized.json
      - go tool oapi-codegen -config api/oapi-arena.yaml api/specs/arena.normalized.json
      - go mod tidy

  build:
    desc: Build all CLI binaries into ./bin
    cmds:
      - for: { var: TOOLS }
        cmd: go build -o "{{.BIN_DIR}}/{{.ITEM}}" ./cmd/{{.ITEM}}

  skill-bundle:
    desc: Cross-compile score and bundle it (gzip+base64) into the score skill
    cmds:
      - for: { var: SKILL_PLATFORMS }
        cmd: |
          os="$(echo '{{.ITEM}}' | cut -d/ -f1)"
          arch="$(echo '{{.ITEM}}' | cut -d/ -f2)"
          tmp="$(mktemp)"
          CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -o "$tmp" ./cmd/score
          gzip -c "$tmp" | base64 > "{{.SCORE_SKILL_DIR}}/score-$os-$arch.gz.b64"
          rm -f "$tmp"
          echo "bundled score-$os-$arch.gz.b64 ($(wc -c < "{{.SCORE_SKILL_DIR}}/score-$os-$arch.gz.b64") bytes)"

  lint:
    desc: Run golangci-lint over the whole module
    cmds:
      - golangci-lint run ./...

  test:
    desc: Run unit tests (no network)
    cmds:
      - go test ./...

  test-integration:
    desc: Run integration tests against live APIs (needs creds in env)
    cmds:
      - go test -tags=integration ./...

  tidy:
    desc: Tidy go.mod/go.sum
    cmds:
      - go mod tidy
